AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Counsel - decision integrity layer for institutional AI agents

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 60
    MemorySize: 1024

Parameters:
  TreasuryAddress:
    Type: String
    Description: Counsel Base treasury wallet address
  TreasuryPrivateKey:
    Type: String
    NoEcho: true
  CdpApiKeyId:
    Type: String
  CdpApiKeySecret:
    Type: String
    NoEcho: true
  SolanaTreasuryKey:
    Type: String
    NoEcho: true
    Default: ""
  SolanaTreasuryAddress:
    Type: String
    Default: ""
  ApiGatewayId:
    Type: String
    Default: ki55wa4a21
    Description: HttpApi ID for self-referenced stub URLs. SAM auto-creates the api as ServerlessHttpApi; we can't !Sub it into the function's env vars without a circular dep, so it's overridable here.
  AdminApiKey:
    Type: String
    NoEcho: true
    Description: Bearer token gating /v1/admin/* endpoints. Empty disables admin (fail-closed).
    Default: ""

Resources:
  CounselFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Environment:
        Variables:
          EVIDENCE_TABLE: !Ref EvidenceTable
          BEDROCK_MODEL_ID: us.anthropic.claude-haiku-4-5-20251001-v1:0
          BASE_RPC_URL: https://mainnet.base.org
          TREASURY_ADDRESS: !Ref TreasuryAddress
          CDP_API_KEY_ID: !Ref CdpApiKeyId
          BEDROCK_REGION: us-east-1
          ORBIS_TRADE_URL: !Sub 'https://${ApiGatewayId}.execute-api.${AWS::Region}.amazonaws.com/v1/stub/orbis/trade-finance-risk'
          ORBIS_EMBEDDED_URL: !Sub 'https://${ApiGatewayId}.execute-api.${AWS::Region}.amazonaws.com/v1/stub/orbis/embedded-finance-score'
          SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
          SOLANA_TREASURY_ADDRESS: !Ref SolanaTreasuryAddress
          ORIGINATOR_NAME: Counsel Demo Client
          ORIGINATOR_COUNTRY: US
          ENFORCE_OFFICER_REGISTRY: "true"
          ENFORCE_CUSTOMER_AUTH: "true"
          EVIDENCE_VAULT_BUCKET: !Ref EvidenceVault
          # Sensitive runtime values (wallet keys, API tokens) are NOT
          # in env vars — they live in Secrets Manager and are fetched
          # at cold-start via services/secrets.py. The Lambda env only
          # carries the resolvable ARN.
          COUNSEL_SECRET_ARN: !Ref CounselRuntimeSecret
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EvidenceTable
        # Secrets Manager: only the runtime composite secret. CloudTrail
        # logs every GetSecretValue, KMS-encrypted at rest, scoped by ARN.
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref CounselRuntimeSecret
        # Evidence vault: write-only for record_evidence, read for
        # officer review. Bucket is object-lock COMPLIANCE so even
        # this role can't shorten retention or delete locked versions.
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectRetention   # required by ObjectLockRetainUntilDate header
                - s3:GetObject
                - s3:GetObjectRetention
              Resource: !Sub 'arn:aws:s3:::${EvidenceVault}/*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              # Scoped to Claude Haiku family + cross-region inference
              # profiles in our AWS account. Wildcards on region cover the
              # cross-region fanout from us.* profiles into us-east-1 /
              # us-east-2 / us-west-2 without enumerating each ARN by hand.
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-*'

  EvidenceTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: pk
        Type: String

  # API Gateway throttling note: per-stage rate + burst limits are
  # applied directly via the apigatewayv2 update-stage API after deploy
  # (see scripts/apply_throttling.sh). SAM's AWS::Serverless::HttpApi
  # DefaultRouteSettings doesn't propagate cleanly through the transform
  # for HTTP APIs.
  #
  # Why not AWS WAF v2? WAF v2 attaches to ALB / CloudFront / REST API
  # / AppSync / App Runner — but NOT to API Gateway HTTP API (v2).
  # Production-grade WAF coverage requires CloudFront in front of the
  # HTTP API; that's on the security roadmap. Native throttling here
  # provides L7 rate-limit protection in the meantime.

  # Composite runtime secret. Seeded from CloudFormation parameters on
  # first deploy; rotate independently afterward via:
  #   aws secretsmanager update-secret --secret-id <arn> \
  #     --secret-string '{...}'
  # Lambda code reads this at cold-start (services/secrets.py) and
  # caches in process memory.
  CounselRuntimeSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: counsel/runtime
      Description: Counsel runtime secrets — wallet keys, CDP, admin token
      SecretString: !Sub |
        {
          "treasury_evm_key": "${TreasuryPrivateKey}",
          "treasury_solana_key": "${SolanaTreasuryKey}",
          "cdp_api_key_secret": "${CdpApiKeySecret}",
          "admin_api_key": "${AdminApiKey}"
        }

  # WORM evidence vault: raw responses from compliance providers and
  # Bedrock synthesis go here, locked for 7 years (typical AML record
  # retention). DynamoDB only stores the hash + S3 URI, so a malicious
  # operator with table-write perms can't rewrite the raw evidence
  # underneath the hash.
  EvidenceVault:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days: 2555  # 7 years
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  ApiUrl:
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Description: Counsel API public URL
